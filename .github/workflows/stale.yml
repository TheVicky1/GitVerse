name: "Stale Issue & PR Management"

on:
  schedule:
    - cron: "30 1 * * *"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 45
          days-before-pr-close: 14
          stale-issue-message: "This issue has been automatically marked as stale due to 60 days of inactivity."
          stale-pr-message: "This pull request has been automatically marked as stale due to 45 days of inactivity."
