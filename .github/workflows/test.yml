name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Code Formatting (gofmt)
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Go Vet Static Analysis
        run: go vet ./...

      - name: Run Go Unit & Integration Tests
        run: go test -v -race ./...

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run WebUI & JavaScript Tests
        run: node --test "internal/webui/jstest/*.test.mjs"

      - name: Verify Generated Docs & Site Sync
        run: go run ./cmd/gendocs -check

      - name: Verify Release Target Compilations
        run: |
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            echo "Compiling target: $target"
            GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath -o /dev/null ./cmd/gitverse || exit 1
          done
          echo "All release targets compiled successfully."
